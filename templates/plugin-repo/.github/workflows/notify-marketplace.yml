# Optional: stößt nach einem Release sofort den Refresh des Marketplaces an,
# statt auf den nächsten nächtlichen Lauf zu warten. Setzt voraus, dass die Marketplace-GitHub-App
# in dieser Organisation installiert ist und ihre Zugangsdaten als Org-Variable/-Secret vorliegen.
name: Marketplace benachrichtigen

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Token der GitHub App erzeugen
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          owner: acme-ai
          repositories: ai-marketplace
      - name: repository_dispatch an den Marketplace senden
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          gh api repos/acme-ai/ai-marketplace/dispatches \
            -f event_type=plugin-released \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}"
